# F20 — Todas las imagenes pineadas a patch exacto (no a tags flotantes).
# Cada pin es la version a la que el tag flotante que habia aqui YA resolvia hoy:
# no hay cambio de version, solo se congela la resolucion para que el despliegue
# sea reproducible y una actualizacion de upstream no entre sin diff.
#   postgres:15-alpine -> 15.18 · redis:7-alpine -> 7.4.9 · rabbitmq:3-alpine -> 3.13.7
# n8n ya estaba pineado (2.31.6) y NO se toca: es el runtime del workflow activo.
services:
  postgres:
    image: postgres:15.18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  n8n:
    image: n8nio/n8n:2.31.6
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?error}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?error}
      N8N_USER_FOLDER: /home/node/.n8n
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_METRICS: ${N8N_METRICS:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows
    ports:
      - "127.0.0.1:5678:5678"
    # F22 R-15 — Mismo healthcheck que el stack de produccion. Sin el, este n8n
    # —el que hospeda el workflow ACTIVO de Lead Qualification— aparecia siempre
    # como "Up" aunque hubiese dejado de atender el webhook, y `restart: always`
    # nunca lo reiniciaba. `start_period` amplio porque el arranque en frio
    # incluye las migraciones del propio esquema de n8n.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  redis:
    image: redis:7.4.9-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass} --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  rabbitmq:
    image: rabbitmq:3.13.7-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-rabbitpass}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

networks:
  portafolio-net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
  redis_data:
  rabbitmq_data:
