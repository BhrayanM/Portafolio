events {
  worker_connections 1024;
}

http {
  # Security headers
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "0" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  add_header Referrer-Policy "same-origin" always;

  # Limits
  client_body_buffer_size 10K;
  client_header_buffer_size 1k;
  client_max_body_size 8m;
  large_client_header_buffers 2 1k;

  upstream backend {
    server portafolio-api:3000;
  }

  upstream frontend {
    server portafolio-frontend:3001;
  }

  upstream n8n {
    server n8n:5678;
  }

  # HTTP → HTTPS redirect
  server {
    listen 80;
    server_name portafolio.ai www.portafolio.ai api.portafolio.ai n8n.portafolio.ai;
    return 301 https://$server_name$request_uri;
  }

  # Frontend (Next.js)
  server {
    listen 443 ssl http2;
    server_name portafolio.ai www.portafolio.ai;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    location /_next/static {
      proxy_pass http://frontend;
      expires 365d;
      add_header Cache-Control "public, immutable";
    }
  }

  # API Backend
  server {
    listen 443 ssl http2;
    server_name api.portafolio.ai;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # n8n (admin access only via Tailscale)
  server {
    listen 443 ssl http2;
    server_name n8n.portafolio.ai;

    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
      proxy_pass http://n8n;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
