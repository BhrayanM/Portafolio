# Nginx — reverse proxy LOCAL (desarrollo).
#
# Este archivo NO es el de produccion: `docker/nginx.conf` sigue siendo el de prod
# (HTTPS + dominio portafolio.ai) y no se toca aqui. Este solo sirve HTTP en
# localhost para trabajar y probar el stack en local. Sin SSL, sin dominio.
#
# Se usa con: docker compose -f docker-compose.dev.yml up -d
#
# El objetivo es que el backend reciba las mismas cabeceras de proxy que recibiria
# en produccion, para que `trust proxy` de Express se comporte igual en los dos sitios.

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # No revelar la version de nginx en las respuestas ni en las paginas de error.
  server_tokens off;

  sendfile on;
  keepalive_timeout 65;

  client_max_body_size 8m;

  log_format proxy_fmt '$remote_addr -> $upstream_addr "$request" '
                       '$status xff="$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log proxy_fmt;

  upstream backend {
    server portafolio-api:3000;
  }

  server {
    listen 80;
    server_name localhost;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;

      # Cabeceras de proxy. X-Forwarded-For es la que consume `trust proxy` en
      # Express para resolver req.ip: sin ella el rate limiter contaria todas las
      # peticiones contra la IP del contenedor nginx.
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host  $host;

      # WebSocket / upgrade passthrough.
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection $http_upgrade;

      proxy_connect_timeout 5s;
      proxy_send_timeout    60s;
      proxy_read_timeout    60s;
    }
  }
}
