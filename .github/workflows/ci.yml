name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Cancela ejecuciones antiguas de la misma rama: solo interesa el ultimo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      # Los tests no necesitan PostgreSQL: usan un doble del pool de `pg`.
      # Tampoco llaman a OpenAI, Slack, HubSpot ni Stripe.
      - name: Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-solo-para-tests

  frontend:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api

  secrets:
    name: Barrido de secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Misma politica que .git/hooks/pre-commit, que es local y no se clona.
      # Aqui se aplica sobre los archivos ya versionados.
      - name: Buscar credenciales y workflows n8n en el arbol versionado
        shell: bash
        run: |
          set -uo pipefail
          fail=0

          # Coincidencias que son claramente valores de ejemplo y no deben alertar.
          PLACEHOLDER='tu_|your|YOUR|xxx|XXX|placeholder|example|EXAMPLE|ejemplo|changeme|\$\{|\$[A-Z_]{3,}|user:pass|usuario:clave|<[a-z-]+>|REPLACE|TODO'

          scan() {
            local pattern="$1" label="$2" hits
            # Se recorren los archivos versionados y se descartan los placeholders.
            hits=$(git ls-files | while read -r f; do
              [ -f "$f" ] || continue
              if grep -oIE -e "$pattern" "$f" 2>/dev/null | grep -qvE "$PLACEHOLDER"; then
                echo "$f"
              fi
            done)
            if [ -n "$hits" ]; then
              echo "::error::$label en: $(echo "$hits" | tr '\n' ' ')"
              fail=1
            fi
          }

          scan 'sk-[A-Za-z0-9_-]{16,}'              'Posible API key de OpenAI'
          scan 'xox[baprs]-[A-Za-z0-9-]{10,}'       'Posible token de Slack'
          scan 'pat-[a-z0-9]{2,}-[A-Za-z0-9-]{10,}' 'Posible token de HubSpot'
          scan 'ghp_[A-Za-z0-9]{20,}'               'Posible token de GitHub'
          scan 'AKIA[0-9A-Z]{16}'                   'Posible AWS access key id'
          scan 'postgres(ql)?://[^:/@[:space:]]+:[^@[:space:]]+@' 'Cadena de conexion Postgres con credenciales'
          scan '-----BEGIN [A-Z ]*PRIVATE KEY-----' 'Clave privada'
          scan '"password"[[:space:]]*:[[:space:]]*"[^"<]' 'Password en claro en un ejemplo'

          if git ls-files | grep -qE '(^|/)n8n/workflows/.*\.json$|(^|/)workflows/.*\.json$'; then
            echo "::error::Hay workflows n8n versionados (SECURITY.md lo prohibe)"
            fail=1
          fi

          if git ls-files | grep -qE '(^|/)\.env$|(^|/)\.env\.(local|production|prod)$'; then
            echo "::error::Hay un archivo .env versionado"
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then
            echo "Sin secretos detectados en el arbol versionado."
          fi
          exit "$fail"
