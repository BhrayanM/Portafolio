name: Temporary Security Audit

on:
  push:
    branches:
      - security/dependabot-remediation-2026-09-13

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: ${{ matrix.directory }}
        run: npm ci
      - name: Audit JSON
        working-directory: ${{ matrix.directory }}
        run: npm audit --json || true
