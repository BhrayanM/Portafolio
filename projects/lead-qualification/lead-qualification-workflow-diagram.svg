<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="url(#bg)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Lead Qualification — Automation Workflow</text>
  <line x1="220" y1="42" x2="680" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- Step 1: Webhook -->
  <rect x="350" y="60" width="200" height="44" rx="6" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="80" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">1. Webhook Trigger</text>
  <text x="450" y="95" text-anchor="middle" fill="#64748b" font-size="9">Inbound Lead Capture</text>
  <line x1="450" y1="104" x2="450" y2="125" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Validation -->
  <rect x="350" y="130" width="200" height="44" rx="6" fill="#3b1a1a" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="150" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">2. Payload Validation</text>
  <text x="450" y="165" text-anchor="middle" fill="#64748b" font-size="9">Schema · Auth · Rate Limit</text>
  <line x1="450" y1="174" x2="450" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: AI Scoring -->
  <rect x="300" y="200" width="300" height="44" rx="6" fill="#2e1052" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="220" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">3. AI Scoring Engine</text>
  <text x="450" y="235" text-anchor="middle" fill="#64748b" font-size="9">LLM Enrichment · Score · Category · Structured Output</text>
  <line x1="450" y1="244" x2="450" y2="265" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 4: Category Router -->
  <rect x="300" y="270" width="300" height="44" rx="6" fill="#3b2000" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="290" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="600">4. Category Router</text>
  <text x="450" y="305" text-anchor="middle" fill="#64748b" font-size="9">Deterministic Switch · Hot / Warm / Cold · Support Route</text>

  <!-- Branches -->
  <line x1="450" y1="314" x2="450" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="330" x2="720" y2="330" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="330" x2="180" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="330" x2="450" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="330" x2="720" y2="345" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 5a: Approval Gate (Hot) -->
  <rect x="90" y="350" width="180" height="44" rx="6" fill="#3b1a1a" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="180" y="370" text-anchor="middle" fill="#fda4af" font-size="11" font-weight="600">5a. Human Approval Gate</text>
  <text x="180" y="385" text-anchor="middle" fill="#64748b" font-size="9">Slack Review · Approve / Reject</text>

  <!-- Step 5b: Queue (Warm/Cold) -->
  <rect x="360" y="350" width="180" height="44" rx="6" fill="#1a3b2a" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="370" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">5b. Follow-up Queue</text>
  <text x="450" y="385" text-anchor="middle" fill="#64748b" font-size="9">Scheduled Cron · Timed Sequence</text>

  <!-- Step 5c: Deflect -->
  <rect x="630" y="350" width="180" height="44" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="720" y="370" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">5c. Route to Support</text>
  <text x="720" y="385" text-anchor="middle" fill="#64748b" font-size="9">Info Request · Ticket Creation</text>

  <!-- Merge arrows -->
  <line x1="180" y1="394" x2="180" y2="415" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="394" x2="450" y2="415" stroke="#475569" stroke-width="2"/>
  <line x1="720" y1="394" x2="720" y2="415" stroke="#475569" stroke-width="2"/>
  <line x1="180" y1="415" x2="720" y2="415" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="415" x2="450" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 6: CRM Logging -->
  <rect x="300" y="435" width="300" height="44" rx="6" fill="#1a3a5c" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="455" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">6. CRM Logging &amp; Persistence</text>
  <text x="450" y="470" text-anchor="middle" fill="#64748b" font-size="9">PostgreSQL · HubSpot Upsert · Idempotent Write</text>
  <line x1="450" y1="479" x2="450" y2="500" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 7: Follow-up Loop -->
  <rect x="300" y="505" width="300" height="44" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="525" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="600">7. Automated Follow-up Loop</text>
  <text x="450" y="540" text-anchor="middle" fill="#64748b" font-size="9">Cron Trigger · State Machine · Engagement Tracking</text>

  <!-- Feedback arrow (loop back from 7 to 6) -->
  <path d="M610,527 L680,527 L680,457 L610,457" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="690" y="495" fill="#475569" font-size="8">update</text>

  <!-- Error flow -->
  <rect x="30" y="570" width="180" height="30" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="120" y="589" text-anchor="middle" fill="#fca5a5" font-size="9">Error Workflow (global)</text>

  <line x1="120" y1="570" x2="120" y2="548" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="120" y1="548" x2="350" y2="548" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="348,545 356,548 348,551" fill="#dc2626"/>
</svg>
