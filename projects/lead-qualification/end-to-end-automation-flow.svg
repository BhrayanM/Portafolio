<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="url(#bg)" rx="12"/>

  <text x="450" y="32" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Enterprise End-to-End Automation Flow</text>
  <line x1="220" y1="42" x2="680" y2="42" stroke="#334155" stroke-width="1"/>

  <!-- Pipeline -->
  <!-- 1. Web Form Capture -->
  <rect x="300" y="65" width="300" height="52" rx="8" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="86" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Web Form Capture</text>
  <text x="450" y="102" text-anchor="middle" fill="#64748b" font-size="9">Inbound lead data collection</text>
  <line x1="450" y1="117" x2="450" y2="138" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Backend Validation -->
  <rect x="300" y="143" width="300" height="52" rx="8" fill="#3b1a1a" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="164" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Backend Validation</text>
  <text x="450" y="180" text-anchor="middle" fill="#64748b" font-size="9">Express.js · Schema enforcement · Rate limiting</text>
  <line x1="450" y1="195" x2="450" y2="216" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. PostgreSQL Database -->
  <rect x="300" y="221" width="300" height="52" rx="8" fill="#1a2e4a" stroke="#1d4ed8" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="242" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">PostgreSQL Database</text>
  <text x="450" y="258" text-anchor="middle" fill="#64748b" font-size="9">Multi-tenant · RLS · Source of truth</text>
  <line x1="450" y1="273" x2="450" y2="294" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. n8n Trigger -->
  <rect x="300" y="299" width="300" height="52" rx="8" fill="#3a1546" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="320" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">n8n Automation Trigger</text>
  <text x="450" y="336" text-anchor="middle" fill="#64748b" font-size="9">Event-driven workflow activation</text>
  <line x1="450" y1="351" x2="450" y2="372" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. OpenAI Enrichment -->
  <rect x="300" y="377" width="300" height="52" rx="8" fill="#2e1052" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="398" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="600">OpenAI GPT-4 Enrichment</text>
  <text x="450" y="414" text-anchor="middle" fill="#64748b" font-size="9">LLM scoring · Structured output · Classification</text>
  <line x1="450" y1="429" x2="450" y2="450" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. HubSpot Sync -->
  <rect x="300" y="455" width="300" height="52" rx="8" fill="#2a1a0a" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="476" text-anchor="middle" fill="#fdba74" font-size="12" font-weight="600">HubSpot CRM Sync</text>
  <text x="450" y="492" text-anchor="middle" fill="#64748b" font-size="9">Idempotent upsert · Contact enrichment</text>
  <line x1="450" y1="507" x2="450" y2="528" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. Slack Notification -->
  <rect x="300" y="533" width="300" height="52" rx="8" fill="#2a1020" stroke="#e11d48" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="554" text-anchor="middle" fill="#fda4af" font-size="12" font-weight="600">Slack Notification</text>
  <text x="450" y="570" text-anchor="middle" fill="#64748b" font-size="9">Team alert · Approval request · Status update</text>
  <line x1="450" y1="585" x2="450" y2="606" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Stripe Billing -->
  <rect x="300" y="611" width="300" height="52" rx="8" fill="#0a2a1a" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="632" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Stripe Billing Integration</text>
  <text x="450" y="648" text-anchor="middle" fill="#64748b" font-size="9">Subscription management · Webhook lifecycle</text>

  <!-- Sidebar: Data Flow Indicators -->
  <rect x="20" y="100" width="120" height="540" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="80" y="370" text-anchor="middle" fill="#475569" font-size="10" transform="rotate(-90, 80, 370)">Data Flow · REST API · Event-Driven</text>

  <rect x="760" y="100" width="120" height="540" rx="6" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="820" y="370" text-anchor="middle" fill="#475569" font-size="10" transform="rotate(90, 820, 370)">Production · Observability · Security</text>
</svg>
