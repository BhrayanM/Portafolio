<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="680" fill="url(#bg)" rx="12"/>

  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">WhatsApp Ecommerce Agent — AI Customer Support Architecture</text>
  <line x1="130" y1="40" x2="770" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- 1. Customer Message -->
  <rect x="350" y="60" width="200" height="46" rx="23" fill="#1a3b2a" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="80" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">💬 Customer Message</text>
  <text x="450" y="96" text-anchor="middle" fill="#64748b" font-size="9">WhatsApp Inbound Webhook</text>
  <line x1="450" y1="106" x2="450" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Intent Routing -->
  <rect x="300" y="133" width="300" height="46" rx="8" fill="#2e1052" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="153" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">🧠 Intent Routing Engine</text>
  <text x="450" y="169" text-anchor="middle" fill="#64748b" font-size="9">LLM classification · Context extraction · Tool selection</text>

  <!-- Branch -->
  <line x1="450" y1="179" x2="450" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="195" x2="770" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="195" x2="130" y2="213" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="320" y1="195" x2="320" y2="213" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="195" x2="580" y2="213" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="195" x2="770" y2="213" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Tools -->
  <rect x="60" y="218" width="140" height="44" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="130" y="238" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Order Lookup</text>
  <text x="130" y="253" text-anchor="middle" fill="#64748b" font-size="8">Shopify API</text>

  <rect x="250" y="218" width="140" height="44" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="320" y="238" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">FAQ Engine</text>
  <text x="320" y="253" text-anchor="middle" fill="#64748b" font-size="8">Knowledge Base</text>

  <rect x="510" y="218" width="140" height="44" rx="6" fill="#1e293b" stroke="#7c3aed" stroke-width="1"/>
  <text x="580" y="238" text-anchor="middle" fill="#c4b5fd" font-size="10" font-weight="600">Product Search</text>
  <text x="580" y="253" text-anchor="middle" fill="#64748b" font-size="8">Catalog API</text>

  <rect x="700" y="218" width="140" height="44" rx="6" fill="#3b1a1a" stroke="#dc2626" stroke-width="1"/>
  <text x="770" y="238" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">Human Handoff</text>
  <text x="770" y="253" text-anchor="middle" fill="#64748b" font-size="8">Escalation</text>

  <!-- Merge back -->
  <line x1="130" y1="262" x2="130" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="320" y1="262" x2="320" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="580" y1="262" x2="580" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="770" y1="262" x2="770" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="280" x2="770" y2="280" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="280" x2="450" y2="298" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. AI Reply -->
  <rect x="300" y="303" width="300" height="46" rx="8" fill="#2e1052" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="323" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="600">🤖 AI Reply Generation</text>
  <text x="450" y="339" text-anchor="middle" fill="#64748b" font-size="9">Context assembly · Message drafting · Response format</text>
  <line x1="450" y1="349" x2="450" y2="371" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Send Reply -->
  <rect x="350" y="376" width="200" height="46" rx="23" fill="#1a3b2a" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="396" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">📤 AI Reply Sent</text>
  <text x="450" y="412" text-anchor="middle" fill="#64748b" font-size="9">Twilio WhatsApp API</text>

  <!-- Human handoff detail -->
  <rect x="700" y="330" width="170" height="55" rx="6" fill="#3b1a1a" stroke="#dc2626" stroke-width="1" filter="url(#shadow)"/>
  <text x="785" y="350" text-anchor="middle" fill="#fda4af" font-size="10" font-weight="600">Human Handoff</text>
  <text x="785" y="365" text-anchor="middle" fill="#64748b" font-size="8">Notify team +</text>
  <text x="785" y="378" text-anchor="middle" fill="#64748b" font-size="8">pause automation</text>

  <!-- Memory & Context -->
  <rect x="60" y="330" width="170" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <text x="145" y="350" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">Conversation Memory</text>
  <text x="145" y="365" text-anchor="middle" fill="#64748b" font-size="8">Persistent store</text>
  <text x="145" y="378" text-anchor="middle" fill="#64748b" font-size="8">Thread context</text>

  <!-- Data flow lines -->
  <line x1="230" y1="357" x2="300" y2="357" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>
  <line x1="600" y1="357" x2="700" y2="357" stroke="#475569" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arrow)"/>

  <!-- Bottom: Technical details -->
  <line x1="80" y1="460" x2="820" y2="460" stroke="#334155" stroke-width="1"/>

  <text x="450" y="485" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">Integration &amp; Reliability Layer</text>

  <rect x="80" y="505" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="160" y="526" text-anchor="middle" fill="#fbbf24" font-size="9">Fast-ACK Protocol</text>

  <rect x="260" y="505" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="340" y="526" text-anchor="middle" fill="#60a5fa" font-size="9">Message Dedup</text>

  <rect x="440" y="505" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="526" text-anchor="middle" fill="#34d399" font-size="9">Rate Limiting</text>

  <rect x="620" y="505" width="160" height="34" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="700" y="526" text-anchor="middle" fill="#f472b6" font-size="9">Error Workflow</text>

  <!-- Tech stack bar -->
  <rect x="200" y="570" width="500" height="30" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="250" y="590" fill="#64748b" font-size="9">n8n</text>
  <text x="310" y="590" fill="#64748b" font-size="9">Docker</text>
  <text x="385" y="590" fill="#64748b" font-size="9">OpenAI</text>
  <text x="455" y="590" fill="#64748b" font-size="9">Shopify</text>
  <text x="535" y="590" fill="#64748b" font-size="9">Twilio</text>
  <text x="610" y="590" fill="#64748b" font-size="9">PostgreSQL</text>

  <!-- Security note -->
  <rect x="200" y="625" width="500" height="30" rx="4" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="450" y="644" text-anchor="middle" fill="#475569" font-size="9">All credentials via environment variables · Zero secrets in code</text>
</svg>
