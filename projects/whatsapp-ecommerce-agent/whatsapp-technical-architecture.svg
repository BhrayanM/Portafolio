<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="900" height="720" fill="url(#bg)" rx="12"/>

  <text x="450" y="30" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">WhatsApp Agent — Technical Infrastructure Architecture</text>
  <line x1="160" y1="40" x2="740" y2="40" stroke="#334155" stroke-width="1"/>

  <!-- Top: WhatsApp -->
  <rect x="350" y="60" width="200" height="44" rx="22" fill="#1a3b2a" stroke="#25D366" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="80" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">📱 WhatsApp</text>
  <text x="450" y="96" text-anchor="middle" fill="#64748b" font-size="9">Business API / Twilio</text>
  <line x1="450" y1="104" x2="450" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- n8n on Docker -->
  <rect x="300" y="133" width="300" height="44" rx="8" fill="#3a1546" stroke="#7c3aed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="153" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">n8n on Docker</text>
  <text x="450" y="169" text-anchor="middle" fill="#64748b" font-size="9">Self-hosted automation engine · Containerized</text>
  <line x1="450" y1="177" x2="450" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pipeline steps -->
  <!-- Webhook -->
  <rect x="350" y="203" width="200" height="38" rx="6" fill="#1e3a5f" stroke="#2563eb" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="222" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="600">Webhook Reception</text>
  <text x="450" y="235" text-anchor="middle" fill="#64748b" font-size="8">HTTP POST payload</text>
  <line x1="450" y1="241" x2="450" y2="258" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ACK 200 -->
  <rect x="350" y="263" width="200" height="38" rx="6" fill="#1a3b2a" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="282" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="600">ACK 200 (Fast Response)</text>
  <text x="450" y="295" text-anchor="middle" fill="#64748b" font-size="8">Prevents provider retries</text>
  <line x1="450" y1="301" x2="450" y2="318" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Deduplication -->
  <rect x="300" y="323" width="300" height="38" rx="6" fill="#3b1a1a" stroke="#dc2626" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="342" text-anchor="middle" fill="#fca5a5" font-size="11" font-weight="600">Deduplication by Message ID</text>
  <text x="450" y="355" text-anchor="middle" fill="#64748b" font-size="8">Atomic reservation · Duplicate rejection</text>
  <line x1="450" y1="361" x2="450" y2="378" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Parsing -->
  <rect x="300" y="383" width="300" height="38" rx="6" fill="#3b2000" stroke="#ea580c" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="402" text-anchor="middle" fill="#fdba74" font-size="11" font-weight="600">Payload Parsing &amp; Validation</text>
  <text x="450" y="415" text-anchor="middle" fill="#64748b" font-size="8">Schema enforcement · Entity extraction</text>
  <line x1="450" y1="421" x2="450" y2="438" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- AI Agent Tool Calling -->
  <rect x="250" y="443" width="400" height="44" rx="8" fill="#2e1052" stroke="#8b5cf6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="463" text-anchor="middle" fill="#ddd6fe" font-size="12" font-weight="600">AI Agent — Tool Calling Loop</text>
  <text x="450" y="479" text-anchor="middle" fill="#64748b" font-size="9">Context assembly · Tool selection · Conversation memory</text>

  <!-- Tools -->
  <line x1="450" y1="487" x2="450" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="500" x2="770" y2="500" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="500" x2="130" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="350" y1="500" x2="350" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="570" y1="500" x2="570" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="500" x2="770" y2="518" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="55" y="523" width="150" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="130" y="540" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">qualify_lead</text>
  <text x="130" y="553" text-anchor="middle" fill="#64748b" font-size="8">Intent scoring</text>

  <rect x="275" y="523" width="150" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="350" y="540" text-anchor="middle" fill="#60a5fa" font-size="10" font-weight="600">lookup_contact</text>
  <text x="350" y="553" text-anchor="middle" fill="#64748b" font-size="8">CRM query</text>

  <rect x="495" y="523" width="150" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="570" y="540" text-anchor="middle" fill="#34d399" font-size="10" font-weight="600">faq_engine</text>
  <text x="570" y="553" text-anchor="middle" fill="#64748b" font-size="8">KB lookup</text>

  <rect x="700" y="523" width="150" height="36" rx="6" fill="#3b1a1a" stroke="#dc2626" stroke-width="1"/>
  <text x="775" y="540" text-anchor="middle" fill="#fca5a5" font-size="10" font-weight="600">escalate_human</text>
  <text x="775" y="553" text-anchor="middle" fill="#64748b" font-size="8">Handoff</text>

  <!-- Merge -->
  <line x1="130" y1="559" x2="130" y2="575" stroke="#475569" stroke-width="2"/>
  <line x1="350" y1="559" x2="350" y2="575" stroke="#475569" stroke-width="2"/>
  <line x1="570" y1="559" x2="570" y2="575" stroke="#475569" stroke-width="2"/>
  <line x1="775" y1="559" x2="775" y2="575" stroke="#475569" stroke-width="2"/>
  <line x1="130" y1="575" x2="775" y2="575" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="575" x2="450" y2="595" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Twilio Reply -->
  <rect x="300" y="600" width="300" height="44" rx="22" fill="#1a3b2a" stroke="#25D366" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="450" y="620" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">📤 Twilio Reply</text>
  <text x="450" y="636" text-anchor="middle" fill="#64748b" font-size="9">WhatsApp API response</text>

  <!-- Sidebar: Error workflow -->
  <rect x="30" y="660" width="200" height="30" rx="4" fill="#1e293b" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="130" y="679" text-anchor="middle" fill="#fca5a5" font-size="9">Global Error Workflow</text>
  <line x1="130" y1="660" x2="130" y2="644" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="130" y1="644" x2="450" y2="644" stroke="#dc2626" stroke-width="1" stroke-dasharray="3,2"/>
  <polygon points="448,641 456,644 448,647" fill="#dc2626"/>

  <!-- Sidebar: Database -->
  <rect x="680" y="660" width="190" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="775" y="679" text-anchor="middle" fill="#64748b" font-size="9">PostgreSQL · Error Logs · Memory</text>
  <line x1="775" y1="660" x2="775" y2="644" stroke="#334155" stroke-width="1" stroke-dasharray="3,2"/>
</svg>
