<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 800" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="800" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">LocalGrowth AI System — Lead Qualification Platform</text>
  <line x1="200" y1="50" x2="700" y2="50" stroke="#334155" stroke-width="1"/>

  <!-- Layer 1: Entry points -->
  <rect x="250" y="70" width="400" height="52" rx="8" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="450" y="93" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Entry Points</text>
  <text x="450" y="110" text-anchor="middle" fill="#ccfbf1" font-size="10">Website · Ads · Chatbot · API</text>

  <!-- Arrow -->
  <line x1="450" y1="122" x2="450" y2="146" stroke="#475569" stroke-width="2"/>
  <polygon points="445,144 450,152 455,144" fill="#475569"/>

  <!-- Layer 2: AI assistant -->
  <rect x="200" y="154" width="500" height="56" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="450" y="178" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Interactive AI Assistant</text>
  <text x="450" y="196" text-anchor="middle" fill="#ddd6fe" font-size="10">Conversational qualification · Structured output</text>

  <!-- Arrow -->
  <line x1="450" y1="210" x2="450" y2="234" stroke="#475569" stroke-width="2"/>
  <polygon points="445,232 450,240 455,232" fill="#475569"/>

  <!-- Layer 3: Scoring engine -->
  <rect x="200" y="242" width="500" height="56" rx="8" fill="url(#purple)" filter="url(#shadow)"/>
  <text x="450" y="266" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Lead Scoring Engine</text>
  <text x="450" y="284" text-anchor="middle" fill="#ddd6fe" font-size="10">Score · Category · Rationale · Deterministic router</text>

  <!-- Arrow -->
  <line x1="450" y1="298" x2="450" y2="322" stroke="#475569" stroke-width="2"/>
  <polygon points="445,320 450,328 455,320" fill="#475569"/>

  <!-- Layer 4: Dedup + validation -->
  <rect x="250" y="330" width="400" height="48" rx="8" fill="url(#red)" filter="url(#shadow)"/>
  <text x="450" y="351" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Deduplication + Validation</text>
  <text x="450" y="367" text-anchor="middle" fill="#fecaca" font-size="10">Business identity · Out-of-schema → error path</text>

  <!-- Arrow -->
  <line x1="450" y1="378" x2="450" y2="402" stroke="#475569" stroke-width="2"/>
  <polygon points="445,400 450,408 455,400" fill="#475569"/>

  <!-- Layer 5: CRM integration layer -->
  <rect x="150" y="410" width="600" height="56" rx="8" fill="url(#orange)" filter="url(#shadow)"/>
  <text x="450" y="434" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">CRM Integration Layer</text>
  <text x="450" y="452" text-anchor="middle" fill="#fed7aa" font-size="10">One contract · Adapters: HubSpot · GoHighLevel · Zoho · Idempotent upsert</text>

  <!-- Branch lines -->
  <line x1="450" y1="466" x2="450" y2="476" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="476" x2="650" y2="476" stroke="#475569" stroke-width="2"/>
  <line x1="250" y1="476" x2="250" y2="494" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="476" x2="450" y2="494" stroke="#475569" stroke-width="2"/>
  <line x1="650" y1="476" x2="650" y2="494" stroke="#475569" stroke-width="2"/>
  <polygon points="245,492 250,500 255,492" fill="#475569"/>
  <polygon points="445,492 450,500 455,492" fill="#475569"/>
  <polygon points="645,492 650,500 655,492" fill="#475569"/>

  <!-- Layer 6: Systems of record -->
  <rect x="80" y="502" width="340" height="56" rx="8" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="250" y="526" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">PostgreSQL — System of Record</text>
  <text x="250" y="544" text-anchor="middle" fill="#bfdbfe" font-size="10">Leads · History · Workflow runs · Errors</text>

  <rect x="480" y="502" width="340" height="56" rx="8" fill="url(#green)" filter="url(#shadow)"/>
  <text x="650" y="526" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">CRM — per Adapter</text>
  <text x="650" y="544" text-anchor="middle" fill="#a7f3d0" font-size="10">HubSpot · GoHighLevel · Zoho</text>

  <!-- Arrows down -->
  <line x1="250" y1="558" x2="250" y2="582" stroke="#475569" stroke-width="2"/>
  <line x1="650" y1="558" x2="650" y2="582" stroke="#475569" stroke-width="2"/>
  <polygon points="245,580 250,588 255,580" fill="#475569"/>
  <polygon points="645,580 650,588 655,580" fill="#475569"/>

  <!-- Layer 7: Notifications -->
  <rect x="250" y="590" width="400" height="52" rx="8" fill="#4A154B" filter="url(#shadow)"/>
  <text x="450" y="613" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">Notification Layer</text>
  <text x="450" y="630" text-anchor="middle" fill="#d6bce4" font-size="10">Slack · Email · SMS (Twilio) — after persistence</text>

  <!-- Arrow -->
  <line x1="450" y1="642" x2="450" y2="666" stroke="#475569" stroke-width="2"/>
  <polygon points="445,664 450,672 455,664" fill="#475569"/>

  <!-- Layer 8: SaaS dashboard -->
  <rect x="200" y="674" width="500" height="56" rx="8" fill="url(#teal)" filter="url(#shadow)"/>
  <text x="450" y="698" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">SaaS Dashboard — Next.js</text>
  <text x="450" y="716" text-anchor="middle" fill="#ccfbf1" font-size="10">Real-time activity feed · Pipeline · Integration health · Automation runs</text>

  <!-- Automation workflows side box -->
  <rect x="620" y="242" width="230" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="735" y="268" text-anchor="middle" fill="#34d399" font-size="12" font-weight="600">Automation Workflows</text>
  <text x="735" y="288" text-anchor="middle" fill="#64748b" font-size="9">Follow-up · Routing</text>
  <text x="735" y="302" text-anchor="middle" fill="#64748b" font-size="9">Nurture · Escalation</text>
  <text x="735" y="316" text-anchor="middle" fill="#64748b" font-size="9">Configured as data</text>
  <line x1="700" y1="242" x2="700" y2="200" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="700" y1="242" x2="650" y2="210" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Error workflow -->
  <rect x="40" y="410" width="80" height="56" rx="6" fill="#8b1a1a" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="80" y="432" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">Global Error</text>
  <text x="80" y="446" text-anchor="middle" fill="#fca5a5" font-size="9" font-weight="600">Workflow</text>
  <line x1="120" y1="438" x2="150" y2="438" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="3,3"/>
  <polygon points="147,435 155,438 147,441" fill="#7f1d1d"/>

  <!-- Legend -->
  <rect x="30" y="780" width="12" height="12" rx="2" fill="url(#teal)"/>
  <text x="48" y="790" fill="#94a3b8" font-size="9">Channels</text>
  <rect x="130" y="780" width="12" height="12" rx="2" fill="url(#purple)"/>
  <text x="148" y="790" fill="#94a3b8" font-size="9">AI</text>
  <rect x="200" y="780" width="12" height="12" rx="2" fill="url(#red)"/>
  <text x="218" y="790" fill="#94a3b8" font-size="9">Security</text>
  <rect x="310" y="780" width="12" height="12" rx="2" fill="url(#orange)"/>
  <text x="328" y="790" fill="#94a3b8" font-size="9">CRM</text>
  <rect x="400" y="780" width="12" height="12" rx="2" fill="url(#blue)"/>
  <text x="418" y="790" fill="#94a3b8" font-size="9">Data</text>
  <rect x="480" y="780" width="12" height="12" rx="2" fill="#4A154B"/>
  <text x="498" y="790" fill="#94a3b8" font-size="9">Alerts</text>
  <rect x="570" y="780" width="12" height="12" rx="2" fill="url(#green)"/>
  <text x="588" y="790" fill="#94a3b8" font-size="9">External</text>
  <rect x="670" y="780" width="12" height="12" rx="2" fill="#8b1a1a"/>
  <text x="688" y="790" fill="#94a3b8" font-size="9">Errors</text>
</svg>
