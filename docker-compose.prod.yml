# F20 — Imagenes pineadas a patch exacto (ver nota en docker-compose.yml).
# Cada pin coincide con lo que el tag flotante resolvia: no hay salto de version.
services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # F20 — El mount estaba en `/etc/ssl` mientras docker/nginx.conf carga los
      # certs desde `/etc/nginx/ssl/`: los ficheros nunca aparecian donde nginx
      # los busca y el contenedor de produccion moria al arrancar
      # ("cannot load certificate ... No such file or directory"). Ademas, montar
      # sobre /etc/ssl tapa el bundle de CAs del contenedor, con lo que cualquier
      # salida TLS desde nginx dejaria de validar. Se mueve el destino a la ruta
      # que la config ya espera; nginx.conf no se toca.
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - portafolio-api
      - portafolio-frontend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  portafolio-api:
    build: ./backend
    restart: always
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  portafolio-frontend:
    build: ./frontend
    restart: always
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  postgres:
    image: postgres:15.18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  n8n:
    image: n8nio/n8n:2.31.6
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?error}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      N8N_HOST: n8n.portafolio.ai
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.portafolio.ai
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?error}
      N8N_USER_FOLDER: /home/node/.n8n
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

networks:
  portafolio-net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
