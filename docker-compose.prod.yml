# Imagenes pineadas a patch exacto (ver nota en docker-compose.yml).
# Cada pin coincide con lo que el tag flotante resolvia: no hay salto de version.

# Nombre de proyecto EXPLICITO. Sin esta linea, compose deriva el nombre
# del directorio y sale `portafolio-publico`: el MISMO que docker-compose.yml. Como
# ademas comparten los nombres de servicio `postgres` y `n8n` y los volumenes
# `postgres_data` / `n8n_data`, un `up` de este fichero no levantaba un stack
# paralelo: RECREABA los contenedores de desarrollo con configuracion de produccion
# (N8N_HOST, N8N_PROTOCOL=https, WEBHOOK_URL=https://...), y con
# ello rompia el `POST /webhook/lead-qualification` en localhost.
# Con nombre propio, los dos stacks quedan aislados.
name: portafolio-prod

services:
  nginx:
    image: nginx:1.27.5-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      # El mount estaba en `/etc/ssl` mientras docker/nginx.conf carga los
      # certs desde `/etc/nginx/ssl/`: los ficheros nunca aparecian donde nginx
      # los busca y el contenedor de produccion moria al arrancar
      # ("cannot load certificate ... No such file or directory"). Ademas, montar
      # sobre /etc/ssl tapa el bundle de CAs del contenedor, con lo que cualquier
      # salida TLS desde nginx dejaria de validar. Se mueve el destino a la ruta
      # que la config ya espera; nginx.conf no se toca.
      - ./docker/ssl:/etc/nginx/ssl:ro
    # Sin healthcheck, un nginx que arrancase pero dejase de servir
    # seguiria como "Up" indefinidamente. Apunta a `location = /healthz` del
    # server de :80 (ver docker/nginx.conf), que responde 200 sin redirigir.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - portafolio-api
      - portafolio-frontend
      # `n8n` faltaba aqui y docker/nginx.conf declara
      # `upstream n8n { server n8n:5678; }`. Nginx resuelve los upstreams al
      # cargar la config y **se niega a arrancar** si un nombre no resuelve
      # ("host not found in upstream"). Como n8n espera a que postgres este
      # healthy, nginx arrancaba antes de que el contenedor existiese.
      - n8n
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  portafolio-api:
    build: ./backend
    restart: always
    env_file: .env
    # `env_file` por si solo no basta. `.env` declara DB_HOST=localhost
    # porque ese es el valor correcto para ejecutar el backend EN EL HOST (lo dice
    # el propio comentario del fichero). Dentro de la red de compose, `localhost`
    # es el contenedor de la API, donde no hay ningun PostgreSQL: el pool daba
    # ECONNREFUSED, `/health` (SELECT 1) caia al .catch() y devolvia 503 en bucle,
    # con lo que el HEALTHCHECK del Dockerfile marcaba el contenedor `unhealthy`.
    # `environment` tiene prioridad sobre `env_file`, asi que se corrige aqui el
    # destino sin tocar `.env` ni romper el flujo de desarrollo en host. Mismo
    # patron que ya usa el servicio n8n mas abajo (DB_POSTGRESDB_HOST: postgres).
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      # Mismo motivo que DB_HOST: `.env` trae los origenes del flujo de
      # desarrollo en host (localhost:3000/3001), no los del stack servido tras
      # nginx. Aqui el navegador carga el frontend desde https://example.com y
      # llama a https://api.example.com: son origenes distintos, asi que sin este
      # valor el backend rechazaria por CORS toda peticion con credenciales
      # (`credentials: 'include'` exige Allow-Origin exacto, nunca '*').
      # `.env` no se toca: sigue sirviendo al flujo en host tal cual.
      CORS_ORIGINS: ${PROD_CORS_ORIGINS:-https://example.com,https://www.example.com}
      # Rol de aplicacion. `POSTGRES_USER` es SUPERUSUARIO en la imagen
      # oficial de PostgreSQL y un superusuario IGNORA Row Level Security aunque
      # las tablas tengan FORCE RLS: mientras el backend conectase con el, las
      # politicas de la migracion 016 no filtraban nada y el aislamiento entre
      # tenants dependia solo del `WHERE tenant_id` del codigo.
      #
      # `app` es NOSUPERUSER + NOBYPASSRLS (migracion 012), asi que el aislamiento
      # pasa a imponerlo el motor. Verificado: sin contexto de tenant, 0 filas.
      #
      # Sin `:?` habria un fallback silencioso al superusuario, que es justo el
      # agujero que esto cierra: si falta la variable, el stack NO arranca.
      DB_USER: ${DB_APP_USER:?falta DB_APP_USER en .env}
      DB_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD en .env}
      # Hay exactamente un proxy delante (nginx). Sin esto, Express
      # resuelve req.ip como la IP del contenedor nginx y el rate limiter mete a
      # TODOS los clientes en el mismo cubo: un solo cliente agota el limite de
      # los demas. Mismo valor que docker-compose.dev.yml, que ya lo declaraba.
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  portafolio-frontend:
    # El build necesita argumentos, asi que `build:` deja de ser una
    # cadena. Las NEXT_PUBLIC_* se hornean al compilar (ver frontend/Dockerfile);
    # pasarlas solo por `env_file` en runtime NO tiene ningun efecto sobre el
    # bundle que descarga el navegador.
    #
    # El valor apunta al vhost `api.example.com` que docker/nginx.conf ya declara:
    # esta es la topologia del proyecto —frontend y API en origenes separados por
    # subdominio, con CORS— y no una ruta nueva inventada aqui.
    #
    # Se parametriza igual que N8N_HOST mas abajo: cambiar de dominio es definir
    # FRONTEND_API_URL en .env, sin tocar este fichero.
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${FRONTEND_API_URL:-https://api.example.com/api}
        NEXT_PUBLIC_REQUEST_TIMEOUT_MS: ${NEXT_PUBLIC_REQUEST_TIMEOUT_MS:-10000}
    restart: always
    env_file: .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  postgres:
    image: postgres:15.18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?error}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

  n8n:
    image: n8nio/n8n:2.31.6
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?error}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
      # Dominio parametrizado. Estaba fijado al dominio real del autor, lo
      # que obliga a editar el compose en cada despliegue y publica infraestructura
      # propia en un repo publico (SECURITY.md regla 3). Se define en .env.
      N8N_HOST: ${N8N_HOST:-n8n.example.com}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL:-https://n8n.example.com}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?error}
      N8N_USER_FOLDER: /home/node/.n8n
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/backup/workflows
    # n8n expone /healthz desde el arranque. `start_period` generoso:
    # el arranque en frio incluye migraciones de su propio esquema y tarda.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - portafolio-net

networks:
  portafolio-net:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
